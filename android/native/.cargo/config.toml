# Android 15 and later can run with memory pages of 16 KB: libsnowhush.so is laid out for them, as newer NDKs do
# on their own.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
